name: Publish npm to publisher registry

# Copy this file to each UI product repo (.github/workflows/publish-npm.yml).
# Canonical copy: ops/publisher/workflows/publish-npm.yml
#
# GitHub Actions variables (org or repo):
#   AWS_PUBLISH_ROLE_ARN      output OidcPublishRoleArn of <publisher-name>-publisher
#   PUBLISHER_CONFIG_PARAM    output PublisherConfigParameter (preferred)
#   PUBLISHER_NAME            alternative — must match publisher_name (e.g. renglo)
#
# Optional:
#   AWS_REGION             default us-east-1
#   PACKAGE_DIR            default .  (use "ui" for Renglo-style extensions)
#   PUBLISH_PUBLIC         "true" to also npm publish to npmjs (needs secret NPM_TOKEN)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_public:
        description: Also publish to public npmjs
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Publish to CodeArtifact
        env:
          PACKAGE_DIR: ${{ vars.PACKAGE_DIR || '.' }}
          PUBLISHER_CONFIG_PARAM: ${{ vars.PUBLISHER_CONFIG_PARAM }}
          PUBLISHER_NAME: ${{ vars.PUBLISHER_NAME }}
        run: |
          set -euo pipefail
          if [ -n "${PUBLISHER_CONFIG_PARAM:-}" ]; then
            CONFIG_PARAM="$PUBLISHER_CONFIG_PARAM"
          elif [ -n "${PUBLISHER_NAME:-}" ]; then
            slug=$(printf '%s' "$PUBLISHER_NAME" | tr '[:upper:]' '[:lower:]' | tr '_' '-')
            CONFIG_PARAM="/publisher/${slug}/config"
          else
            echo "Set GitHub variable PUBLISHER_CONFIG_PARAM (stack output) or PUBLISHER_NAME" >&2
            exit 1
          fi
          CONFIG=$(aws ssm get-parameter --name "$CONFIG_PARAM" --query Parameter.Value --output text)
          DOMAIN=$(printf '%s' "$CONFIG" | python3 -c 'import json,sys; print(json.load(sys.stdin)["domain"])')
          REPO=$(printf '%s' "$CONFIG" | python3 -c 'import json,sys; print(json.load(sys.stdin)["npm_repository"])')
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          aws codeartifact login --tool npm \
            --domain "$DOMAIN" \
            --domain-owner "$ACCOUNT" \
            --repository "$REPO"
          cd "$PACKAGE_DIR"
          npm publish --access restricted

      - name: Publish to public npmjs
        if: ${{ vars.PUBLISH_PUBLIC == 'true' || github.event.inputs.publish_public == 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_DIR: ${{ vars.PACKAGE_DIR || '.' }}
        run: |
          set -euo pipefail
          cd "$PACKAGE_DIR"
          npm config set registry https://registry.npmjs.org/
          npm publish --access public
